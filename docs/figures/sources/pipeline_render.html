<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body {
  margin: 0;
  padding: 24px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: #fff;
}
svg { display: block; }

/* Section indicator on left side */
.section-bar {
  stroke-width: 0;
  rx: 2.5;
}
.section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

/* Step number badge */
.step-circle { stroke-width: 2.5; }
.step-num { font-size: 13px; font-weight: 700; text-anchor: middle; }

/* Box content */
.box-title { fill: #18202f; font-size: 14.5px; font-weight: 700; }
.box-sub { fill: #5c667a; font-size: 11.5px; font-weight: 500; }

/* Edges */
.edge { fill: none; stroke: #1c2538; stroke-width: 2.5; }
.edge-fork { fill: none; stroke: #5c667a; stroke-width: 2; }
.fork-label {
  fill: #5c667a;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Output stage */
.output-title { fill: #fff; font-size: 18px; font-weight: 700; }
.output-sub { fill: #b9c4d9; font-size: 12px; font-weight: 500; }
.output-result { fill: #10b981; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
</style></head><body>
<svg viewBox="0 0 760 1320" xmlns="http://www.w3.org/2000/svg" width="2280" height="3960">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#1c2538"></path>
    </marker>
    <marker id="arrow-fork" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#5c667a"></path>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ====== SECTION INDICATORS (left rail) ====== -->
  <!-- Moved further left (x=30 for label, x=55 for bar) so stage 5a/5b fork doesn't overlap -->
  <!-- INPUT: y=20 to y=100 → midpoint=60 -->
  <rect class="section-bar" x="55" y="20" width="4" height="80" fill="#5c667a"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 60) rotate(-90)" text-anchor="middle" fill="#5c667a">INPUT</text>

  <!-- RETRIEVAL: y=140 to y=388 → midpoint=264 -->
  <rect class="section-bar" x="55" y="140" width="4" height="248" fill="#2d6cdf"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 264) rotate(-90)" text-anchor="middle" fill="#2d6cdf">RETRIEVAL</text>

  <!-- BRIDGE LOGIC: y=428 to y=664 → midpoint=546 -->
  <rect class="section-bar" x="55" y="428" width="4" height="236" fill="#b02a37"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 546) rotate(-90)" text-anchor="middle" fill="#b02a37">BRIDGE LOGIC</text>

  <!-- RERANK + GENERATE: y=704 to y=1132 → midpoint=918 -->
  <rect class="section-bar" x="55" y="704" width="4" height="428" fill="#1f8f6f"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 918) rotate(-90)" text-anchor="middle" fill="#1f8f6f">RERANK + GENERATE</text>

  <!-- OUTPUT: y=1172 to y=1300 → midpoint=1236 -->
  <rect class="section-bar" x="55" y="1172" width="4" height="128" fill="#10b981"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 1236) rotate(-90)" text-anchor="middle" fill="#10b981">OUTPUT</text>

  <!-- ====== STAGE 1: CTI-Bench prompt (y=20-100) ====== -->
  <g transform="translate(230 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="#f7f8fb" stroke="#c9d1dd" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 34)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">1</text>
  </g>
  <text class="box-title" x="390" y="52" text-anchor="middle">CTI-Bench prompt</text>
  <text class="box-sub" x="390" y="74" text-anchor="middle">CVE description (RCM row, no CVE-ID)</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 105 L390 135"></path>

  <!-- ====== STAGE 2: Hybrid retrieval (y=140-236) ====== -->
  <g transform="translate(230 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="96" rx="10" fill="#e7eefb" stroke="#2d6cdf" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 158)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#2d6cdf" stroke="#2d6cdf"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">2</text>
  </g>
  <text class="box-title" x="390" y="172" text-anchor="middle">Hybrid retrieval</text>
  <text class="box-sub" x="390" y="194" text-anchor="middle">BM25 + BGE-small-en-v1.5  ·  α = 0.5</text>
  <text class="box-sub" x="390" y="214" text-anchor="middle">336k chunks indexed  ·  TOP_K = 8</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 241 L390 271"></path>

  <!-- ====== STAGE 3: HyDE + CE filter (y=276-372) ====== -->
  <g transform="translate(230 276)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="96" rx="10" fill="#e7eefb" stroke="#2d6cdf" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 294)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#2d6cdf" stroke="#2d6cdf"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">3</text>
  </g>
  <text class="box-title" x="390" y="308" text-anchor="middle">HyDE expansion + CE filter</text>
  <text class="box-sub" x="390" y="330" text-anchor="middle">LLM drafts a CWE-style hypothesis</text>
  <text class="box-sub" x="390" y="350" text-anchor="middle">retrieve again  ·  cross-encoder ≥ 0.3</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 377 L390 423"></path>

  <!-- ====== STAGE 4: Graph expansion (y=428-490) ====== -->
  <g transform="translate(230 428)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="62" rx="10" fill="#f7f8fb" stroke="#5c667a" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 437)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">4</text>
  </g>
  <text class="box-title" x="390" y="454" text-anchor="middle">Graph expansion (2-hop)</text>
  <text class="box-sub" x="390" y="476" text-anchor="middle">ATT&amp;CK · CAPEC · CWE · CVE neighbors</text>

  <!-- Fork: mapped vs unmapped -->
  <path class="edge-fork" d="M390 490 L390 514"></path>
  <path class="edge-fork" d="M220 514 L560 514"></path>
  <path class="edge-fork" marker-end="url(#arrow-fork)" d="M220 514 L220 545"></path>
  <path class="edge-fork" marker-end="url(#arrow-fork)" d="M560 514 L560 545"></path>
  <text class="fork-label" x="305" y="510" text-anchor="end">mapped</text>
  <text class="fork-label" x="475" y="510" text-anchor="start">unmapped</text>

  <!-- ====== STAGE 5a: NVD CWE bridge (y=548-640) ====== -->
  <g transform="translate(85 548)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="92" rx="10" fill="#fbe9eb" stroke="#b02a37" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(65 566)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#b02a37" stroke="#b02a37"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">5a</text>
  </g>
  <text class="box-title" x="220" y="578" text-anchor="middle">NVD CWE bridge</text>
  <text class="box-sub" x="220" y="600" text-anchor="middle">inject NVD `cwe_ids` into context</text>
  <text class="box-sub" x="220" y="620" text-anchor="middle">strip competing CWE chunks</text>

  <!-- ====== STAGE 5b: k-NN voting (y=548-640) ====== -->
  <g transform="translate(425 548)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="92" rx="10" fill="#fbe9eb" stroke="#b02a37" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(405 566)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#b02a37" stroke="#b02a37"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">5b</text>
  </g>
  <text class="box-title" x="560" y="578" text-anchor="middle">Weighted k-NN CWE voting</text>
  <text class="box-sub" x="560" y="600" text-anchor="middle">over 150k mapped CVEs</text>
  <text class="box-sub" x="560" y="620" text-anchor="middle">θ = 0.90  ·  margin = 1.50</text>

  <!-- Merge -->
  <path class="edge-fork" d="M220 640 L220 664"></path>
  <path class="edge-fork" d="M560 640 L560 664"></path>
  <path class="edge-fork" d="M220 664 L560 664"></path>
  <path class="edge" marker-end="url(#arrow)" d="M390 664 L390 699"></path>

  <!-- ====== STAGE 6: Cross-encoder rerank (y=704-800) ====== -->
  <g transform="translate(230 704)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="96" rx="10" fill="#e4f3ed" stroke="#1f8f6f" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 722)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#1f8f6f" stroke="#1f8f6f"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">6</text>
  </g>
  <text class="box-title" x="390" y="736" text-anchor="middle">Cross-encoder rerank</text>
  <text class="box-sub" x="390" y="758" text-anchor="middle">BAAI/bge-reranker-base (278M params)</text>
  <text class="box-sub" x="390" y="778" text-anchor="middle">skipped if bridge or high-confidence k-NN</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 805 L390 835"></path>

  <!-- ====== STAGE 7: Final context assembly (y=840-902) ====== -->
  <g transform="translate(230 840)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="62" rx="10" fill="#f7f8fb" stroke="#5c667a" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 849)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">7</text>
  </g>
  <text class="box-title" x="390" y="866" text-anchor="middle">Final context assembly</text>
  <text class="box-sub" x="390" y="888" text-anchor="middle">retrieved chunks + CTI-Bench prompt</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 907 L390 937"></path>

  <!-- ====== STAGE 8: LLM (y=942-1028) ====== -->
  <g transform="translate(230 942)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="86" rx="10" fill="#efe9ff" stroke="#7c4dff" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 955)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#7c4dff" stroke="#7c4dff"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">8</text>
  </g>
  <text class="box-title" x="390" y="970" text-anchor="middle">Qwen2.5-7B-Instruct (vLLM, FP16)</text>
  <text class="box-sub" x="390" y="992" text-anchor="middle">single chat completion  ·  default temperature</text>
  <text class="box-sub" x="390" y="1012" text-anchor="middle">apples-to-apples with CTI-Bench</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 1033 L390 1063"></path>

  <!-- ====== STAGE 9: Phrase selector (y=1068-1130) ====== -->
  <g transform="translate(230 1068)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="62" rx="10" fill="#e4f3ed" stroke="#1f8f6f" stroke-width="1.8" stroke-dasharray="5 3"></rect>
  </g>
  <g transform="translate(210 1077)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#1f8f6f" stroke="#1f8f6f" stroke-dasharray="3 2"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">9</text>
  </g>
  <text class="box-title" x="390" y="1094" text-anchor="middle">Official CWE phrase selector</text>
  <text class="box-sub" x="390" y="1116" text-anchor="middle">post-LLM rewrite  ·  alternate_term match</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 1135 L390 1167"></path>

  <!-- ====== STAGE 10: Output (y=1172-1300) ====== -->
  <g transform="translate(160 1172)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="128" rx="12" fill="#1c2538" stroke="#10b981" stroke-width="2.5"></rect>
  </g>
  <g transform="translate(140 1216)">
    <circle class="step-circle" cx="20" cy="20" r="20" fill="#10b981" stroke="#10b981"></circle>
    <text class="step-num" x="20" y="26" fill="#fff" style="font-size:15px;">10</text>
  </g>
  <text class="output-title" x="390" y="1206" text-anchor="middle">Predicted CWE-ID</text>
  <text class="output-result" x="390" y="1244" text-anchor="middle">851 / 1000  =  85.1% strict</text>
  <text class="output-sub" x="390" y="1278" text-anchor="middle">+13 percentage points vs GPT-4 on CTI-Bench RCM</text>
</svg>
</body></html>
