<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body {
  margin: 0;
  padding: 24px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  background: #fff;
}
svg { display: block; }

.section-bar { stroke-width: 0; rx: 2.5; }
.section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

.step-circle { stroke-width: 2.5; }
.step-num { font-size: 13px; font-weight: 700; text-anchor: middle; }

.box-title { fill: #18202f; font-size: 14.5px; font-weight: 700; }
.box-sub { fill: #5c667a; font-size: 11.5px; font-weight: 500; }

.edge { fill: none; stroke: #1c2538; stroke-width: 2.5; }
.edge-fork { fill: none; stroke: #5c667a; stroke-width: 2; }
.fork-label {
  fill: #5c667a;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.output-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
.output-sub { fill: #475569; font-size: 12px; font-weight: 500; }
.output-result { fill: #059669; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
</style></head><body>
<svg viewBox="0 0 760 1160" xmlns="http://www.w3.org/2000/svg" width="2280" height="3480">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#1c2538"></path>
    </marker>
    <marker id="arrow-fork" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#5c667a"></path>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ====== SECTION INDICATORS (left rail) ====== -->
  <!-- INPUT: y=20-100 -->
  <rect class="section-bar" x="55" y="20" width="4" height="80" fill="#5c667a"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 60) rotate(-90)" text-anchor="middle" fill="#5c667a">INPUT</text>

  <!-- RETRIEVAL: y=140-328 (Hybrid retrieval + Graph expansion) -->
  <rect class="section-bar" x="55" y="140" width="4" height="188" fill="#2d6cdf"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 234) rotate(-90)" text-anchor="middle" fill="#2d6cdf">RETRIEVAL</text>

  <!-- ENRICHMENT & RERANK: y=410-724 -->
  <rect class="section-bar" x="55" y="410" width="4" height="314" fill="#b02a37"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 567) rotate(-90)" text-anchor="middle" fill="#b02a37">Enrichment &amp; Rerank</text>

  <!-- GENERATION: y=776-876 -->
  <rect class="section-bar" x="55" y="776" width="4" height="100" fill="#7c4dff"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 826) rotate(-90)" text-anchor="middle" fill="#7c4dff">GENERATION</text>

  <!-- OUTPUT: y=906-1126 -->
  <rect class="section-bar" x="55" y="906" width="4" height="220" fill="#10b981"></rect>
  <text class="section-label" x="0" y="0" transform="translate(30 1016) rotate(-90)" text-anchor="middle" fill="#10b981">OUTPUT</text>

  <!-- ====== STAGE 1: CTI-Bench prompt (y=20-100) ====== -->
  <g transform="translate(230 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="80" rx="10" fill="#f7f8fb" stroke="#c9d1dd" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 34)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">1</text>
  </g>
  <text class="box-title" x="390" y="52" text-anchor="middle">CTI-Bench prompt</text>
  <text class="box-sub" x="390" y="74" text-anchor="middle">CVE description (RCM row, no CVE-ID)</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 105 L390 135"></path>

  <!-- ====== STAGE 2: Hybrid retrieval (y=140-236) ====== -->
  <g transform="translate(230 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="96" rx="10" fill="#e7eefb" stroke="#2d6cdf" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 158)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#2d6cdf" stroke="#2d6cdf"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">2</text>
  </g>
  <text class="box-title" x="390" y="172" text-anchor="middle">Hybrid retrieval</text>
  <text class="box-sub" x="390" y="194" text-anchor="middle">BM25 + BGE-small-en-v1.5  ·  α = 0.5</text>
  <text class="box-sub" x="390" y="214" text-anchor="middle">332k chunks indexed  ·  TOP_K = 8</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 236 L390 261"></path>

  <!-- ====== STAGE 3: Graph expansion (universal, y=266-328) ====== -->
  <g transform="translate(230 266)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="62" rx="10" fill="#f7f8fb" stroke="#5c667a" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 275)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">3</text>
  </g>
  <text class="box-title" x="390" y="292" text-anchor="middle">Graph expansion</text>
  <text class="box-sub" x="390" y="314" text-anchor="middle">1-hop CVE · CWE neighbors traversal</text>

  <!-- Fork: NVD-mapped vs NVD-unmapped (below Graph expansion) -->
  <path class="edge-fork" d="M390 328 L390 355"></path>
  <path class="edge-fork" d="M220 355 L560 355"></path>
  <path class="edge-fork" marker-end="url(#arrow-fork)" d="M220 355 L220 405"></path>
  <path class="edge-fork" marker-end="url(#arrow-fork)" d="M560 355 L560 405"></path>
  <text class="fork-label" x="290" y="347" text-anchor="end">NVD-mapped (Fast Path)</text>
  <text class="fork-label" x="490" y="347" text-anchor="start">NVD-unmapped (Reasoning Path)</text>

  <!-- ====== LEFT COLUMN (Mapped Path) ====== -->
  <!-- STAGE 4a: NVD CWE bridge (y=410-506) -->
  <g transform="translate(85 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="96" rx="10" fill="#fbe9eb" stroke="#b02a37" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(65 428)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#b02a37" stroke="#b02a37"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">4a</text>
  </g>
  <text class="box-title" x="220" y="442" text-anchor="middle">NVD CWE bridge</text>
  <text class="box-sub" x="220" y="464" text-anchor="middle">inject NVD `cwe_ids` into context</text>
  <text class="box-sub" x="220" y="484" text-anchor="middle">strip competing CWE chunks</text>
  <path class="edge" marker-end="url(#arrow)" d="M220 506 L220 531"></path>

  <!-- STAGE 5a: Final context assembly (y=536-598) -->
  <g transform="translate(85 536)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="62" rx="10" fill="#f7f8fb" stroke="#5c667a" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(65 545)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">5a</text>
  </g>
  <text class="box-title" x="220" y="562" text-anchor="middle">Final context assembly</text>
  <text class="box-sub" x="220" y="584" text-anchor="middle">NVD-bridged context + prompt</text>

  <!-- Bypass edge: mapped path runs straight down to the merge bar above LLM -->
  <path class="edge" d="M220 598 L220 754"></path>
  <text class="box-sub" x="232" y="668" text-anchor="start" style="font-weight:700; fill:#7c4dff;">Fast Path Bypass</text>
  <text class="box-sub" x="232" y="688" text-anchor="start">No k-NN or CE rerank</text>

  <!-- ====== RIGHT COLUMN (Unmapped Path) ====== -->
  <!-- STAGE 4b: Weighted k-NN CWE voting (y=410-506) -->
  <g transform="translate(425 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="96" rx="10" fill="#fbe9eb" stroke="#b02a37" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(405 428)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#b02a37" stroke="#b02a37"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">4b</text>
  </g>
  <text class="box-title" x="560" y="442" text-anchor="middle">Weighted k-NN CWE voting</text>
  <text class="box-sub" x="560" y="464" text-anchor="middle">over 150k mapped CVE neighbors</text>
  <text class="box-sub" x="560" y="484" text-anchor="middle">θ = 0.90  ·  margin = 1.50</text>
  <path class="edge" marker-end="url(#arrow)" d="M560 506 L560 531"></path>

  <!-- STAGE 5b: Cross-encoder rerank (y=536-632) -->
  <g transform="translate(425 536)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="96" rx="10" fill="#e4f3ed" stroke="#1f8f6f" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(405 554)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#1f8f6f" stroke="#1f8f6f"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">5b</text>
  </g>
  <text class="box-title" x="560" y="568" text-anchor="middle">Cross-encoder rerank</text>
  <text class="box-sub" x="560" y="590" text-anchor="middle">BAAI/bge-reranker-base</text>
  <text class="box-sub" x="560" y="610" text-anchor="middle">sorts candidate CWE chunks</text>
  <path class="edge" marker-end="url(#arrow)" d="M560 632 L560 657"></path>

  <!-- STAGE 6b: Final context assembly (y=662-724) -->
  <g transform="translate(425 662)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="62" rx="10" fill="#f7f8fb" stroke="#5c667a" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(405 671)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#5c667a" stroke="#5c667a"></circle>
    <text class="step-num" x="20" y="25" fill="#fff" style="font-size:12px;">6b</text>
  </g>
  <text class="box-title" x="560" y="688" text-anchor="middle">Final context assembly</text>
  <text class="box-sub" x="560" y="710" text-anchor="middle">unmapped context + prompt</text>
  <path class="edge" d="M560 724 L560 754"></path>

  <!-- ====== Merge both paths into the single LLM ====== -->
  <path class="edge" d="M220 754 L560 754"></path>
  <path class="edge" marker-end="url(#arrow)" d="M390 754 L390 776"></path>

  <!-- ====== STAGE 7: GENERATION — single LLM (y=776-876) ====== -->
  <g transform="translate(230 776)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="100" rx="10" fill="#efe9ff" stroke="#7c4dff" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 794)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#7c4dff" stroke="#7c4dff"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">7</text>
  </g>
  <text class="box-title" x="390" y="808" text-anchor="middle">LLM</text>
  <text class="box-sub" x="390" y="830" text-anchor="middle">Phi-4-mini-reasoning</text>
  <text class="box-sub" x="390" y="850" text-anchor="middle">general-purpose 3.8B model</text>
  <text class="box-sub" x="390" y="870" text-anchor="middle">single call · 2048-token budget</text>

  <!-- LLM into CWE-ID extraction. -->
  <path class="edge" marker-end="url(#arrow)" d="M390 876 L390 901"></path>

  <!-- ====== STAGE 8: CWE-ID extraction (y=906-968) ====== -->
  <g transform="translate(230 906)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="62" rx="10" fill="#e4f3ed" stroke="#1f8f6f" stroke-width="1.8"></rect>
  </g>
  <g transform="translate(210 915)">
    <circle class="step-circle" cx="20" cy="20" r="18" fill="#1f8f6f" stroke="#1f8f6f" stroke-dasharray="3 2"></circle>
    <text class="step-num" x="20" y="25" fill="#fff">8</text>
  </g>
  <text class="box-title" x="390" y="932" text-anchor="middle">CWE-ID extraction</text>
  <text class="box-sub" x="390" y="954" text-anchor="middle">final CWE-NNN token from answer text</text>
  <path class="edge" marker-end="url(#arrow)" d="M390 968 L390 993"></path>

  <!-- ====== STAGE 9: Output (y=998-1126) ====== -->
  <g transform="translate(160 998)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="128" rx="12" fill="#e4f3ed" stroke="#10b981" stroke-width="2.5"></rect>
  </g>
  <g transform="translate(140 1042)">
    <circle class="step-circle" cx="20" cy="20" r="20" fill="#10b981" stroke="#10b981"></circle>
    <text class="step-num" x="20" y="26" fill="#fff" style="font-size:15px;">9</text>
  </g>
  <text class="output-title" x="390" y="1032" text-anchor="middle">Predicted CWE-ID</text>
  <text class="output-result" x="390" y="1070" text-anchor="middle">90.9% Accuracy (909 / 1000)</text>
  <text class="output-sub" x="390" y="1104" text-anchor="middle">Mapped: 92.7% (837/903) · Unmapped: 74.2% (72/97)</text>
</svg>
</body></html>
