<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      background: #fff;
    }
    svg { display: block; }
    .chart-title { fill: #18202f; font-size: 24px; font-weight: 800; }
    .method-name { fill: #18202f; font-size: 17px; font-weight: 750; }
    .method-sub { fill: #5c667a; font-size: 13px; font-weight: 550; }
    .bar-value { fill: #18202f; font-size: 16px; font-weight: 800; }
    .bar-value-ours { fill: #047857; font-size: 21px; font-weight: 900; }
    .axis-tick { fill: #5c667a; font-size: 14px; }
    .grid { stroke: #e0e4eb; stroke-width: 1.2; stroke-dasharray: 5 5; fill: none; }
    .gpt4-baseline-line { stroke: #b02a37; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .baseline-label { fill: #b02a37; font-size: 13px; font-weight: 800; }
    .legend-text { fill: #18202f; font-size: 14px; font-weight: 650; }
    .note { fill: #5c667a; font-size: 13px; font-weight: 550; }
    .callout { fill: #047857; font-size: 16px; font-weight: 850; }
  </style>
</head>
<body>
<svg viewBox="0 50 1280 840" xmlns="http://www.w3.org/2000/svg" width="3840" height="2520">

  <g transform="translate(315 64)">
    <rect x="0" y="0" width="18" height="18" fill="#047857"></rect>
    <text class="legend-text" x="28" y="15">Ours</text>
    <rect x="150" y="0" width="18" height="18" fill="#2d6cdf"></rect>
    <text class="legend-text" x="178" y="15">Open-source</text>
    <rect x="340" y="0" width="18" height="18" fill="#7c8aa3"></rect>
    <text class="legend-text" x="368" y="15">Closed / proprietary</text>
  </g>

  <!-- Plot area: x=405-1165, y=105-815. X scale: 40% to 90%, 1% = 15.2px. -->
  <line class="grid" x1="405" y1="100" x2="405" y2="815"></line>
  <line class="grid" x1="557" y1="100" x2="557" y2="815"></line>
  <line class="grid" x1="709" y1="100" x2="709" y2="815"></line>
  <line class="grid" x1="861" y1="100" x2="861" y2="815"></line>
  <line class="grid" x1="1013" y1="100" x2="1013" y2="815"></line>
  <line class="grid" x1="1165" y1="100" x2="1165" y2="815"></line>

  <text class="axis-tick" x="405" y="840" text-anchor="middle">40%</text>
  <text class="axis-tick" x="557" y="840" text-anchor="middle">50%</text>
  <text class="axis-tick" x="709" y="840" text-anchor="middle">60%</text>
  <text class="axis-tick" x="861" y="840" text-anchor="middle">70%</text>
  <text class="axis-tick" x="1013" y="840" text-anchor="middle">80%</text>
  <text class="axis-tick" x="1165" y="840" text-anchor="middle">90%</text>
  <line stroke="#18202f" stroke-width="1.6" x1="405" y1="815" x2="1165" y2="815"></line>

  <!-- GPT-4 reference at 72.0%: 405 + 32*15.2 = 891.4 -->
  <line class="gpt4-baseline-line" x1="891" y1="96" x2="891" y2="815"></line>
  <text class="baseline-label" x="899" y="91">GPT-4 baseline</text>

  <!-- 1. Ours routed ensemble: 86.4%, width=(86.4-40)*15.2 = 705.28 -->
  <rect x="405" y="112" width="705" height="42" fill="#047857" stroke="#ffd24d" stroke-width="3.2"></rect>
  <text class="method-name" x="390" y="130" text-anchor="end" style="font-weight:900;">Ours (routed ensemble)</text>
  <text class="method-sub" x="390" y="149" text-anchor="end" style="font-weight:750;">Granite + Foundation-Sec · CVE/CWE RAG</text>
  <text class="bar-value-ours" x="1122" y="140">86.4%</text>

  <!-- 2. Sec-Gemini v1: ~86%, width=699.2 -->
  <rect x="405" y="166" width="699" height="38" fill="#7c8aa3"></rect>
  <text class="method-name" x="390" y="183" text-anchor="end">Sec-Gemini v1 (Google)</text>
  <text class="method-sub" x="390" y="201" text-anchor="end">closed · self-reported</text>
  <text class="bar-value" x="1112" y="191">~86%</text>

  <!-- 3. SecLM: ~85%, width=684 -->
  <rect x="405" y="216" width="684" height="38" fill="#7c8aa3"></rect>
  <text class="method-name" x="390" y="233" text-anchor="end">SecLM (Google)</text>
  <text class="method-sub" x="390" y="251" text-anchor="end">closed · self-reported</text>
  <text class="bar-value" x="1097" y="241">~85%</text>

  <!-- 4. RoBERTa: 75.6%, width=541.12 -->
  <rect x="405" y="266" width="541" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="283" text-anchor="end">RoBERTa-base CVE-to-CWE</text>
  <text class="method-sub" x="390" y="301" text-anchor="end">125M open · fine-tuned</text>
  <text class="bar-value" x="956" y="291">75.6%</text>

  <!-- 5. Foundation-Sec-8B-R: 75.3%, width=536.56 -->
  <rect x="405" y="316" width="537" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="333" text-anchor="end">Foundation-Sec-8B-R (Cisco)</text>
  <text class="method-sub" x="390" y="351" text-anchor="end">8B open · security reasoning</text>
  <text class="bar-value" x="952" y="341">75.3%</text>

  <!-- 6. GPT-4: 72.0%, width=486.4 -->
  <rect x="405" y="366" width="486" height="38" fill="#7c8aa3"></rect>
  <text class="method-name" x="390" y="383" text-anchor="end">GPT-4</text>
  <text class="method-sub" x="390" y="401" text-anchor="end">closed · no retrieval</text>
  <text class="bar-value" x="902" y="391">72.0%</text>

  <!-- 7. Foundation-Sec-8B: 72.0%, width=486.4 -->
  <rect x="405" y="416" width="486" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="433" text-anchor="end">Foundation-Sec-8B (Cisco)</text>
  <text class="method-sub" x="390" y="451" text-anchor="end">8B open · security pretrain</text>
  <text class="bar-value" x="902" y="441">72.0%</text>

  <!-- 8. WhiteRabbitNeo: 71.1%, width=472.72 -->
  <rect x="405" y="466" width="473" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="483" text-anchor="end">WhiteRabbitNeo-V2-70B</text>
  <text class="method-sub" x="390" y="501" text-anchor="end">70B open · security tune</text>
  <text class="bar-value" x="889" y="491">71.1%</text>

  <!-- 9. Foundation-Sec-8B-I: 70.4%, width=462.08 -->
  <rect x="405" y="516" width="462" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="533" text-anchor="end">Foundation-Sec-8B-I (Cisco)</text>
  <text class="method-sub" x="390" y="551" text-anchor="end">8B open · instruct</text>
  <text class="bar-value" x="878" y="541">70.4%</text>

  <!-- 10. Llama-Primus-Base: 67.8%, width=422.56 -->
  <rect x="405" y="566" width="423" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="583" text-anchor="end">Llama-Primus-Base</text>
  <text class="method-sub" x="390" y="601" text-anchor="end">8B open · security pretrain</text>
  <text class="bar-value" x="839" y="591">67.8%</text>

  <!-- 11. GPT-3.5: 67.2%, width=413.44 -->
  <rect x="405" y="616" width="413" height="38" fill="#7c8aa3"></rect>
  <text class="method-name" x="390" y="633" text-anchor="end">GPT-3.5</text>
  <text class="method-sub" x="390" y="651" text-anchor="end">closed · no retrieval</text>
  <text class="bar-value" x="829" y="641">67.2%</text>

  <!-- 12. Gemini 1.5: 66.6%, width=404.32 -->
  <rect x="405" y="666" width="404" height="38" fill="#7c8aa3"></rect>
  <text class="method-name" x="390" y="683" text-anchor="end">Gemini 1.5</text>
  <text class="method-sub" x="390" y="701" text-anchor="end">closed · no retrieval</text>
  <text class="bar-value" x="820" y="691">66.6%</text>

  <!-- 13. LLaMA3-70B: 65.9%, width=393.68 -->
  <rect x="405" y="716" width="394" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="733" text-anchor="end">LLaMA3-70B</text>
  <text class="method-sub" x="390" y="751" text-anchor="end">70B open · no retrieval</text>
  <text class="bar-value" x="810" y="741">65.9%</text>

  <!-- 14. LLaMA3-8B: 44.7%, width=71.44 -->
  <rect x="405" y="766" width="71" height="38" fill="#2d6cdf"></rect>
  <text class="method-name" x="390" y="783" text-anchor="end">LLaMA3-8B</text>
  <text class="method-sub" x="390" y="801" text-anchor="end">8B open · no retrieval</text>
  <text class="bar-value" x="488" y="791">44.7%</text>
</svg>
</body>
</html>
